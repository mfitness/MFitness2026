workflows:
  ios-workflow:
    name: M Fitness iOS

    environment:
      xcode: latest

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Check iOS project
        script: |
          cd ios/App
          echo "Files in ios/App:"
          ls -la
          echo "Xcode projects:"
          find . -maxdepth 2 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild \
            -project "App.xcodeproj" \
            -scheme "App" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build
