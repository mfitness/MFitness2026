workflows:
  ios-workflow:
    name: M Fitness iOS

    environment:
      xcode: latest

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Build iOS
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App" \
            --archive-directory build/archive \
            --ipa-directory build/ipa

    artifacts:
      - ios/App/build/ipa/*.ipa
      - ios/App/build/archive/*.xcarchive
